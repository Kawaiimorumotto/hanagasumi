<head>

<style>
:root{--red:#8f3438;--deep:#43282a;--gold:#b48a43;--paper:#f8f0de;--cream:#fffaf0;--line:#c8ab79;--muted:#77695e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#201a18;color:#332927;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}button,input,textarea,select{font:inherit}button{border:0}
#app{width:100%;max-width:520px;min-height:100dvh;margin:auto;background:var(--paper);overflow:hidden;position:relative}
header{height:58px;display:grid;grid-template-columns:auto minmax(88px,1fr) auto;align-items:center;gap:7px;padding:0 10px;background:#fffaf0f2;border-bottom:1px solid var(--line);position:relative;z-index:10}.logo{font-weight:bold;letter-spacing:.08em;font-size:17px;white-space:nowrap}.wallet{font-size:10px;white-space:nowrap;text-align:right}.screen{display:none;min-height:calc(100dvh - 54px);padding-bottom:82px}.screen.active{display:block}
.home{position:relative;background:radial-gradient(circle at 50% 20%,#fffaf0,#e8d4ae 68%,#d4bd91);overflow:hidden}
.home:before{content:"";position:absolute;inset:0;opacity:.25;background:linear-gradient(90deg,transparent 49%,#9d3d3d 50%,transparent 51%),linear-gradient(0deg,transparent 49%,#b48a43 50%,transparent 51%);background-size:42px 42px}
.hero{height:calc(100dvh - 136px);min-height:520px;position:relative;display:flex;justify-content:center;align-items:center}
.char{width:min(64vw,280px);height:min(74vh,480px);overflow:hidden;min-height:370px;border-radius:46% 46% 12% 12%;background:linear-gradient(#e7c6ae 0 21%,#493034 21% 38%,#f2dfbe 38% 68%,#7e303d 68%);box-shadow:0 18px 45px #4a332533;position:relative;transition:.15s;user-select:none}
.char.blink{filter:brightness(1.05)}.char img.avatar{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:contain;z-index:1;pointer-events:none;transform:translate(-50%,-50%) scale(1);transform-origin:center center}.zone.edit-zone{border:1px dashed #8f3438;background:#8f34381c;z-index:4}.zone.edit-zone b{font-size:10px;background:#8f3438;color:#fff;padding:2px 5px;border-radius:5px;position:absolute;left:3px;top:3px}.hit-preview{position:relative;width:220px;height:330px;margin:10px auto;border-radius:46% 46% 12% 12%;background:linear-gradient(#e7c6ae 0 21%,#493034 21% 38%,#f2dfbe 38% 68%,#7e303d 68%);overflow:hidden;box-shadow:0 8px 22px #4a332522}.hit-preview img{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:contain;transform:translate(-50%,-50%);pointer-events:none}.zone-row{border:1px solid #ddceb2;border-radius:9px;padding:9px;margin:8px 0;background:#fffaf0}.range-line{display:grid;grid-template-columns:42px 1fr 54px;gap:6px;align-items:center;font-size:11px;margin:5px 0}.range-line input[type=range]{padding:0;border:0}.range-line output{text-align:right}.char-switch{width:100%;min-width:0;max-width:125px;background:#fffdf8;border:1px solid var(--line);border-radius:7px;padding:5px;font-size:11px;white-space:nowrap;overflow:hidden}.editor-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.preview-card{background:#f3e5c9;border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}.preview-title{font-weight:bold;color:var(--red);font-size:12px;margin-bottom:6px}.preview-note{font-size:10px;color:var(--muted);margin-top:6px}.image-stage,.hit-stage{position:relative;width:min(82vw,290px);height:min(112vw,390px);margin:10px auto;border-radius:46% 46% 12% 12%;background:linear-gradient(#e7c6ae 0 21%,#493034 21% 38%,#f2dfbe 38% 68%,#7e303d 68%);overflow:hidden;box-shadow:0 8px 22px #4a332522}.image-stage img,.hit-stage img{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:contain;pointer-events:none;transform-origin:center center}.empty-preview{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#806f61;font-size:12px;text-align:center;padding:20px}.hit-stage .zone.edit-zone{cursor:pointer}.zone.edit-zone.active{outline:2px solid #43282a;background:#8f34384a}.zone.edit-zone b{white-space:nowrap}.char .zone{z-index:3}
.char:before{content:"";position:absolute;width:43%;height:28%;top:16%;left:28%;border:5px solid #432c30;border-radius:50%;background:#f3cdb4}
.char:after{content:"";position:absolute;width:13%;height:8%;top:27%;left:37%;border-radius:50%;background:#432c30;box-shadow:110% 0 #432c30}
.zone{position:absolute;z-index:3;border:1px dashed transparent;border-radius:30px;background:transparent}
.zone:active{background:#8f343822}.head{top:6%;left:10%;width:80%;height:26%}.face{top:18%;left:25%;width:50%;height:20%}.hand{top:42%;left:5%;width:35%;height:28%}.body{top:40%;left:27%;width:55%;height:40%}
.dialogue{position:absolute;left:13px;right:13px;bottom:12px;background:#fffaf0ed;border:1px solid var(--line);border-radius:12px;padding:12px 15px;box-shadow:0 7px 20px #4b30221e;z-index:5}
.name{color:var(--red);font-size:12px;font-weight:bold}.line{font-size:16px;line-height:1.6;margin-top:3px}.meter{height:7px;background:#e0d2b7;border-radius:99px;margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--red);width:12%}.love{font-size:10px;color:var(--muted);margin-top:3px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:68px;padding-bottom:env(safe-area-inset-bottom);background:#fffaf0f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
.nav button{background:none;color:#55443d;font-size:10px;padding:6px 2px}.nav b{display:block;font-size:20px;color:var(--red);line-height:22px}
.panel{padding:17px 14px}.panel h2{margin:2px 0 13px;font-size:20px}.card{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.item{text-align:left;background:var(--cream);border:1px solid var(--line);border-radius:11px;padding:9px}.icon{height:85px;background:#efe1c7;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:7px}.row{display:flex;justify-content:space-between;gap:6px;align-items:center}.tag{font-size:10px;color:#785a24;border:1px solid var(--gold);border-radius:99px;padding:2px 5px}.small{font-size:11px;color:var(--muted)}.btn{background:var(--red);color:white;border:1px solid #72272b;border-radius:8px;padding:9px 12px}.btn.alt{background:var(--cream);color:var(--red);border-color:var(--line)}
.gacha-banner{height:215px;border-radius:15px;background:linear-gradient(145deg,#652a37,#b8874d 57%,#f0ddb1);color:#fff9ec;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 12px 30px #43212640;margin-bottom:13px}.gacha-banner h3{font-size:27px;margin:5px}.result{line-height:1.8}
.char-preview{height:300px;display:flex;align-items:center;justify-content:center}.char.smallchar{width:160px;height:270px}
label{display:block;font-size:12px;margin:9px 0 5px}input,textarea,select{width:100%;background:#fffdf8;border:1px solid var(--line);border-radius:7px;padding:8px;color:#332927}textarea{resize:vertical}.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:5px}.tabs button{white-space:nowrap}.editor{margin-top:10px}.hint{font-size:11px;color:var(--muted);line-height:1.55}.sep{border:0;border-top:1px solid #ddceb2;margin:14px 0}
.modal{display:none;position:fixed;inset:0;background:#1d1614aa;z-index:40;align-items:flex-end}.modal.show{display:flex}.modalbox{width:min(520px,100%);max-height:88dvh;overflow:auto;background:var(--paper);border-radius:18px 18px 0 0;padding:16px}.toast{display:none;position:fixed;z-index:50;left:50%;bottom:86px;transform:translateX(-50%);background:#2d2421;color:white;padding:9px 14px;border-radius:99px;font-size:12px}
</style>
</head>
<body>
<div id="app">
<header><div class="logo">むすびどころ</div><select id="charSwitcher" class="char-switch" aria-label="キャラクター切替"></select><div class="wallet">花玉 <b id="gems">1200</b>　贈り物 <b id="count">0</b></div></header>

<section id="home" class="screen active home">
 <div class="hero">
  <div id="char" class="char"></div>
  <div class="dialogue"><div class="name" id="name">新しいキャラクター</div><div class="line" id="line">……。</div><div class="meter"><i id="meter"></i></div><div class="love" id="love">親密度 0 / 100</div></div>
 </div>
</section>

<section id="gift" class="screen"><div class="panel"><h2>贈り物</h2><div class="card hint">アイテムをタップするとキャラクターに贈れます。反応と親密度は編集画面から変更できます。</div><div id="giftGrid" class="grid"></div></div></section>
<section id="gacha" class="screen"><div class="panel"><h2>召喚</h2><div class="gacha-banner"><div>期間限定</div><h3 id="gachaName">夏祭り・百花繚乱</h3><div>SSR 5%　SR 20%　R 75%</div></div><div class="row"><button class="btn" onclick="pull(1)">1回　100花玉</button><button class="btn" onclick="pull(10)">10回　900花玉</button></div><div id="result" class="card result" style="margin-top:12px">召喚結果がここに表示されます。</div></div></section>
<section id="dress" class="screen"><div class="panel"><h2>着せ替え</h2><div class="card"><div class="char-preview"><div class="char smallchar"></div></div><div id="outfitNow">通常衣装</div></div><div id="outfitGrid" class="grid"></div></div></section>
<section id="edit" class="screen"><div class="panel"><h2>制作・設定</h2><div class="card"><div class="tabs"><button class="btn alt" onclick="tab('ce')">キャラクター</button><button class="btn alt" onclick="tab('hit')">当たり判定</button><button class="btn alt" onclick="tab('ge')">贈り物</button><button class="btn alt" onclick="tab('oe')">衣装</button><button class="btn alt" onclick="tab('qa')">ガチャ</button><button class="btn alt" onclick="tab('io')">保存</button></div><div id="ce" class="editor"></div><div id="hit" class="editor" style="display:none"></div><div id="ge" class="editor" style="display:none"></div><div id="oe" class="editor" style="display:none"></div><div id="qa" class="editor" style="display:none"></div><div id="io" class="editor" style="display:none"></div></div></div></section>

<nav class="nav"><button onclick="go('home')"><b>花</b>ホーム</button><button onclick="go('gift')"><b>贈</b>贈り物</button><button onclick="go('gacha')"><b>召</b>ガチャ</button><button onclick="go('dress')"><b>衣</b>着せ替え</button><button onclick="go('edit')"><b>筆</b>編集</button></nav>
</div>
<div id="modal" class="modal"><div class="modalbox"><div id="modalBody"></div><button class="btn alt" onclick="closeModal()" style="margin-top:10px">閉じる</button></div></div>
<div id="toast" class="toast"></div>

<script>const seed={
characters:[],activeCharacterId:null,
gifts:[
{id:"onigiri",name:"おにぎり",icon:"🍙",rarity:"R",fav:8,normal:"お、これ好きなんだよね。",love:"具は何かな？",great:"君が握ってくれたの？",owned:3},
{id:"apple",name:"りんご飴",icon:"🍎",rarity:"SR",fav:12,normal:"お祭りのやつだね。",love:"……これ、好き。",great:"これを選んでくれたの？",owned:2},
{id:"matcha",name:"抹茶",icon:"🍵",rarity:"N",fav:3,normal:"渋いの選ぶね。",love:"落ち着く味だね。",great:"こういうの、覚えててくれたんだ。",owned:5},
{id:"dango",name:"月見団子",icon:"🍡",rarity:"R",fav:7,normal:"ひとつ食べる？",love:"月がきれいな夜に食べたいね。",great:"一緒に食べよう。",owned:1},
{id:"ramune",name:"ラムネ",icon:"🫧",rarity:"SR",fav:10,normal:"懐かしいな。",love:"祭りって感じがする。",great:"……一緒に飲む？",owned:0},
{id:"firework",name:"花火",icon:"🎆",rarity:"SSR",fav:20,normal:"きれいだね。",love:"夜空に咲く花みたい。",great:"……君と見たかった。",owned:0}],
outfits:[{id:"default",name:"通常衣装",rarity:"N",owned:true},{id:"summer",name:"夏祭りの浴衣",rarity:"SR",owned:false},{id:"formal",name:"月夜の晴れ着",rarity:"SSR",owned:false}],
gacha:{name:"夏祭り・百花繚乱"},images:{gifts:{},outfits:{}}};

const zoneDefaults=[
{id:"head",label:"頭",x:10,y:6,w:80,h:26,lines:["髪、触るの好きなの？","……くすぐったいよ。","また頭を撫でてる。"]},
{id:"face",label:"顔",x:25,y:18,w:50,h:20,lines:["そんなに顔を見る？","……近いよ。","楽しそうだね。"]},
{id:"hand",label:"手",x:5,y:42,w:35,h:28,lines:["手、繋ぎたいの？","……しょうがないな。","どうしたの？"]},
{id:"body",label:"身体",x:27,y:40,w:55,h:40,lines:["そこはつつくところじゃないよ。","ふふ、元気だね。","今日はご機嫌だね。"]}
];
function makeCharacter(name="新しいキャラクター"){
 const id="char_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
 return {id,name,love:0,image:{scale:1,x:0,y:0},zones:JSON.parse(JSON.stringify(zoneDefaults))};
}
function migrate(){
 const fresh=JSON.parse(JSON.stringify(seed));
 let current=JSON.parse(localStorage.getItem("musubidokoro-v7")||"null");
 if(current&&Array.isArray(current.characters))return current;
 current=JSON.parse(localStorage.getItem("musubidokoro-v6")||"null");
 if(current&&Array.isArray(current.characters)){
   current.characters=current.characters.filter(c=>c.name!=="綾乃");
   if(!current.characters.length){const c=makeCharacter();current.characters=[c];current.activeCharacterId=c.id}
   if(!current.characters.some(c=>c.id===current.activeCharacterId))current.activeCharacterId=current.characters[0].id;
   current.images=current.images||{gifts:{},outfits:{}}; current.images.gifts=current.images.gifts||{}; current.images.outfits=current.images.outfits||{};
   localStorage.setItem("musubidokoro-v7",JSON.stringify(current));
   return current;
 }
 let source=JSON.parse(localStorage.getItem("musubidokoro-v5")||"null");
 if(!source) source=JSON.parse(localStorage.getItem("hanagasumi-v2")||"null");
 if(source){
   fresh.gifts=source.gifts||fresh.gifts; fresh.outfits=source.outfits||fresh.outfits; fresh.gacha=source.gacha||fresh.gacha;
   fresh.images.gifts=source.images?.gifts||{}; fresh.images.outfits=source.images?.outfits||{};
   fresh.characters=Array.isArray(source.characters)?source.characters:[];
   // 旧版で残っていた「綾乃」だけを一度だけ整理する。ユーザーが作った他のキャラクターは残す。
   const removed=fresh.characters.filter(c=>c.name==="綾乃");
   fresh.characters=fresh.characters.filter(c=>c.name!=="綾乃");
   removed.forEach(c=>{try{localStorage.removeItem("musubidokoro-image-char:"+c.id)}catch(e){}});
 }
 if(!fresh.characters.length){const c=makeCharacter();fresh.characters=[c];fresh.activeCharacterId=c.id}
 if(!fresh.characters.some(c=>c.id===fresh.activeCharacterId))fresh.activeCharacterId=fresh.characters[0].id;
 fresh.images=fresh.images||{};fresh.images.gifts=fresh.images.gifts||{};fresh.images.outfits=fresh.images.outfits||{};fresh.images.characters=fresh.images.characters||{};
 localStorage.setItem("musubidokoro-v7",JSON.stringify(fresh));
 return fresh;
}
let data=migrate();
let gems=Number(localStorage.getItem("hanagasumi-gems")||1200);
let currentTab="ce";
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function activeChar(){return data.characters.find(c=>c.id===data.activeCharacterId)||data.characters[0]}
function save(){localStorage.setItem("musubidokoro-v7",JSON.stringify(data));localStorage.setItem("hanagasumi-gems",gems);render()}
function saveSilent(){localStorage.setItem("musubidokoro-v7",JSON.stringify(data));localStorage.setItem("hanagasumi-gems",gems)}
function go(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").style.display="none",1500)}
function rand(a){return a&&a.length?a[Math.floor(Math.random()*a.length)]:"……"}

const IMAGE_DB="musubidokoro-images-v3";
let imageCache={chars:{},gifts:{},outfits:{}};
const imageObjectUrls=[];
function openImageDB(){return new Promise((resolve,reject)=>{try{const r=indexedDB.open(IMAGE_DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("images"))db.createObjectStore("images")};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
function makeImageUrl(v){if(!v)return "";if(typeof v==="string")return v;if(v instanceof Blob){const u=URL.createObjectURL(v);imageObjectUrls.push(u);return u}return ""}
async function putImage(key,value){
 // v7: IndexedDBにはBlobをそのまま保存。iPhone写真(HEIC/HEIF)をdata URL→canvasに通すと失敗しやすいため、元ファイルを保持する。
 try{const db=await openImageDB();await new Promise((resolve,reject)=>{const tx=db.transaction("images","readwrite");tx.objectStore("images").put(value,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();return true}catch(e){console.warn("IndexedDB save failed",e);return false}
}
async function getImage(key){
 try{const db=await openImageDB();const v=await new Promise((resolve,reject)=>{const tx=db.transaction("images","readonly");const r=tx.objectStore("images").get(key);r.onsuccess=()=>resolve(r.result||"");r.onerror=()=>reject(r.error)});db.close();if(v)return makeImageUrl(v)}catch(e){}
 // v7以前のdata URLも読み込めるようにする
 try{return localStorage.getItem("musubidokoro-image-"+key)||""}catch(e){return ""}
}
async function deleteImage(key){try{const db=await openImageDB();await new Promise((resolve,reject)=>{const tx=db.transaction("images","readwrite");tx.objectStore("images").delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){}try{localStorage.removeItem("musubidokoro-image-"+key)}catch(e){}}
async function loadImages(){
 for(const c of data.characters)imageCache.chars[c.id]=await getImage("char:"+c.id);
 for(const g of data.gifts)imageCache.gifts[g.id]=await getImage("gift:"+g.id);
 for(const o of data.outfits)imageCache.outfits[o.id]=await getImage("outfit:"+o.id);
}
function avatarTransform(p){return `translate(calc(-50% + ${Number(p?.x)||0}%),calc(-50% + ${Number(p?.y)||0}%)) scale(${Number(p?.scale)||1})`}
function setAvatar(){const c=activeChar(),box=$("char");box.innerHTML="";if(!c)return;const img=imageCache.chars[c.id];if(img){const im=document.createElement("img");im.className="avatar";im.src=img;im.style.transform=avatarTransform(c.image);box.appendChild(im)}
 for(const z of c.zones){const b=document.createElement("button");b.className="zone";b.dataset.zone=z.id;b.setAttribute("aria-label",z.label);b.title=z.label;b.style.left=z.x+"%";b.style.top=z.y+"%";b.style.width=z.w+"%";b.style.height=z.h+"%";b.onclick=()=>tapZone(z.id);box.appendChild(b)} }
function tapZone(id){const c=activeChar(),z=c?.zones.find(x=>x.id===id);$("line").textContent=rand(z?.lines||["……"]);$("char").classList.add("blink");setTimeout(()=>$("char").classList.remove("blink"),170)}
async function fileToImage(input,callback){const f=input.files?.[0];if(!f)return;try{const blob=await readImageBlob(f);const url=makeImageUrl(blob);if(!url)throw new Error("画像URLを作れませんでした");await callback(url,blob);toast("画像を保存したよ");render()}catch(e){console.error("image load failed",e,f?.name,f?.type,e?.message);toast("この画像形式は読み込めなかったよ。写真アプリでJPEG/PNGにしてから、もう一度選んでみて")}}
function readImageBlob(file,max=1400){return new Promise((resolve,reject)=>{
 const type=(file.type||"").toLowerCase(),name=(file.name||"").toLowerCase();
 // iPhoneの写真で多いHEIC/HEIFはcanvas変換をしない。Safari 17+はHEICを<img>で表示できるので元Blobを保存する。
 if(type==="image/heic"||type==="image/heif"||name.endsWith(".heic")||name.endsWith(".heif")){resolve(file);return}
 const url=URL.createObjectURL(file);
 const img=new Image();
 img.onload=()=>{try{const scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale)),h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d");ctx.drawImage(img,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(url);b?resolve(b):reject(new Error("canvas toBlob failed"))},"image/webp",.82)}catch(e){URL.revokeObjectURL(url);reject(e)}};
 img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Image decode failed"))};img.src=url;
 })}
function renderSwitcher(){const sel=$("charSwitcher");sel.innerHTML=data.characters.map(c=>`<option value="${esc(c.id)}">${esc(c.name||"名前なし")}</option>`).join("");sel.value=data.activeCharacterId;sel.onchange=()=>switchCharacter(sel.value)}
function switchCharacter(id){if(!data.characters.some(c=>c.id===id))return;data.activeCharacterId=id;saveSilent();render();const c=activeChar();$("line").textContent=rand(c.zones.find(z=>z.id==="head")?.lines||["……"]);toast(c.name+"に切り替えたよ")}
function render(){const c=activeChar();if(!c)return;$("name").textContent=c.name||"名前なし";setAvatar();$("meter").style.width=Math.min(100,c.love||0)+"%";$("love").textContent=`親密度 ${c.love||0} / 100`;$("gems").textContent=gems;$("count").textContent=data.gifts.reduce((s,g)=>s+g.owned,0);$("gachaName").textContent=data.gacha.name;renderSwitcher();renderGifts();renderOutfits();renderEditors();tab(currentTab)}
function renderGifts(){$("giftGrid").innerHTML=data.gifts.map(g=>`<button class="item" onclick="give('${g.id}')"><div class="icon">${imageCache.gifts?.[g.id]?`<img src="${imageCache.gifts[g.id]}" style="width:100%;height:100%;object-fit:contain;border-radius:8px">`:g.icon}</div><div class="row"><b>${esc(g.name)}</b><span class="tag">${g.rarity}</span></div><div class="small">所持 ${g.owned}　親密度 +${g.fav}</div></button>`).join("")}
function give(id){let g=data.gifts.find(x=>x.id===id);const c=activeChar();if(!g.owned)return toast("そのアイテムは持っていないよ");g.owned--;c.love=Math.min(100,c.love+g.fav);$("line").textContent=c.love>=70?g.great:c.love>=30?g.love:g.normal;save();go("home");toast(g.name+"を贈った！")}
function renderOutfits(){$("outfitGrid").innerHTML=data.outfits.map(o=>`<button class="item" onclick="equip('${o.id}')"><div class="icon">${imageCache.outfits?.[o.id]?`<img src="${imageCache.outfits[o.id]}" style="width:100%;height:100%;object-fit:contain;border-radius:8px">`:(o.id==="summer"?"👘":o.id==="formal"?"🌙":"🌸")}</div><div class="row"><b>${esc(o.name)}</b><span class="tag">${o.rarity}</span></div><div class="small">${o.owned?"所持済み":"未所持"}</div></button>`).join("")}
function equip(id){let o=data.outfits.find(x=>x.id===id);if(!o.owned)return toast("まだ持っていない衣装だよ");$("outfitNow").textContent=o.name;toast(o.name+"に着替えた！")}
function pull(n){let cost=n===10?900:100;if(gems<cost)return toast("花玉が足りないよ");gems-=cost;let a=[];for(let i=0;i<n;i++){let r=Math.random(),rar=r<.05?"SSR":r<.25?"SR":"R",pool=data.gifts.filter(g=>g.rarity===rar);let g=rand(pool.length?pool:data.gifts);g.owned++;a.push(g.name)}$("result").innerHTML="<b>召喚結果</b><br>"+a.join("、");save();toast("召喚完了！")}
function tab(id){currentTab=id;document.querySelectorAll(".editor").forEach(x=>x.style.display="none");if($(id))$(id).style.display="block"}
function imagePreviewHtml(c){const img=imageCache.chars[c.id],p=c.image||{scale:1,x:0,y:0};return `<div class="preview-card"><div class="preview-title">画像配置プレビュー</div><div class="image-stage" id="imagePreview">${img?`<img src="${img}" style="transform:${avatarTransform(p)}">`:`<div class="empty-preview">まだ画像がありません<br>下の「立ち絵画像」から選択してね</div>`}</div><div class="preview-note">スライダーを動かすと、このプレビューもその場で変わります。</div></div>`}
function renderEditors(){
 const c=activeChar();
 $("ce").innerHTML=`<h3>キャラクター</h3><label>現在のキャラクター</label><select id="editCharSelect" onchange="switchCharacter(this.value)">${data.characters.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?"selected":""}>${esc(x.name||"名前なし")}</option>`).join("")}</select><div class="editor-actions"><button class="btn" onclick="addCharacter()">＋キャラクター追加</button>${data.characters.length>1?`<button class="btn alt" onclick="removeCharacter()">現在のキャラを削除</button>`:""}</div><hr class="sep"><label>名前</label><input id="en" value="${esc(c.name)}"><label>親密度</label><input id="el" type="number" min="0" max="100" value="${c.love}"><label>立ち絵画像</label><input id="charImg" type="file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif,image/*" onchange="fileToImage(this,async (x,blob)=>{imageCache.chars[c.id]=x;await putImage('char:'+c.id,blob)})"><p class="hint">画像はこのブラウザにだけ保存されます。iPhoneの写真（HEIC）もそのまま保存できます。別の端末やブラウザには共有されません。</p>${imagePreviewHtml(c)}<label>画像サイズ：<span id="scaleVal">${Math.round((c.image?.scale||1)*100)}%</span></label><input type="range" min="50" max="200" step="1" value="${Math.round((c.image?.scale||1)*100)}" oninput="setImageSetting('scale',Number(this.value)/100);$('scaleVal').textContent=this.value+'%'"/><label>画像の左右位置：<span id="xVal">${c.image?.x||0}%</span></label><input type="range" min="-50" max="50" step="1" value="${c.image?.x||0}" oninput="setImageSetting('x',Number(this.value));$('xVal').textContent=this.value+'%'"/><label>画像の上下位置：<span id="yVal">${c.image?.y||0}%</span></label><input type="range" min="-50" max="50" step="1" value="${c.image?.y||0}" oninput="setImageSetting('y',Number(this.value));$('yVal').textContent=this.value+'%'"/><p class="hint">実際のホーム画面と同じ基準で拡大・縮小・位置調整できます。</p><hr class="sep">${c.zones.map(z=>`<label>${esc(z.label)}の台詞（1行1個）</label><textarea id="l_${z.id}" rows="4">${esc(z.lines.join("\n"))}</textarea>`).join("")}<button class="btn" onclick="saveChar()">キャラクター設定を保存</button>`;
 $("hit").innerHTML=`<h3>つつく位置・当たり判定</h3><p class="hint">赤い枠が「つつける場所」です。下のプレビューを見ながら、左・上・幅・高さを調整できます。</p>${hitPreviewHtml()}${c.zones.map(z=>zoneControlHtml(z)).join("")}<button class="btn" onclick="saveHitboxes()">当たり判定と台詞を保存</button>`;
 $("ge").innerHTML=`<h3>贈り物</h3>${data.gifts.map(g=>`<div class="card"><b>${g.icon} ${esc(g.name)}</b><label>所持数</label><input id="o_${g.id}" type="number" min="0" value="${g.owned}"><label>通常反応</label><input id="n_${g.id}" value="${esc(g.normal)}"><label>好き</label><input id="l_${g.id}" value="${esc(g.love)}"><label>大好物</label><input id="g_${g.id}" value="${esc(g.great)}"><label>親密度</label><input id="f_${g.id}" type="number" value="${g.fav}"><label>アイテム画像</label><input type="file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif,image/*" onchange="fileToImage(this,async (x,blob)=>{imageCache.gifts[g.id]=x;await putImage('gift:'+g.id,blob)})"></div>`).join("")}<button class="btn" onclick="saveGifts()">保存</button><hr class="sep"><h4>新しい贈り物を追加</h4><label>名前</label><input id="newGiftName" placeholder="例：わたあめ"><label>絵文字（画像なし時の表示）</label><input id="newGiftIcon" value="🎁"><label>レアリティ</label><select id="newGiftRarity"><option>N</option><option>R</option><option>SR</option><option>SSR</option></select><button class="btn alt" onclick="addGift()">贈り物を追加</button>`;
 $("oe").innerHTML=`<h3>衣装</h3>${data.outfits.map(o=>`<div class="card"><label>衣装名</label><input id="out_${o.id}" value="${esc(o.name)}"><div class="small">${o.rarity} / ${o.owned?"所持":"未所持"}</div><label>衣装画像</label><input type="file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif,image/*" onchange="fileToImage(this,async (x,blob)=>{imageCache.outfits[o.id]=x;await putImage('outfit:'+o.id,blob)})"></div>`).join("")}<button class="btn" onclick="saveOutfits()">保存</button><hr class="sep"><h4>新しい衣装を追加</h4><label>衣装名</label><input id="newOutfitName" placeholder="例：藤の花の着物"><label>レアリティ</label><select id="newOutfitRarity"><option>N</option><option>R</option><option>SR</option><option>SSR</option></select><button class="btn alt" onclick="addOutfit()">衣装を追加</button>`;
 $("qa").innerHTML=`<h3>ガチャ</h3><label>ガチャ名</label><input id="qname" value="${esc(data.gacha.name)}"><button class="btn" onclick="data.gacha.name=$('qname').value;save();toast('保存したよ')">保存</button>`;
 $("io").innerHTML=`<h3>データ</h3><p class="hint">キャラクター・当たり判定・台詞・親密度・贈り物・衣装・ガチャ設定をJSONとして保存／復元できます。画像はブラウザ内に別保存されます。</p><button class="btn" onclick="exportJSON()">JSON書き出し</button> <button class="btn alt" onclick="$('importFile').click()">JSON読み込み</button><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importJSON(this)"><hr class="sep"><button class="btn" onclick="exportZip()">ゲームデータZIP</button><p class="hint">このHTML、PWA設定、現在のゲームデータをまとめたZIPを作ります。</p><hr class="sep"><button class="btn alt" onclick="resetProject()">むすびどころのデータを初期化</button>`;
}

function hitPreviewHtml(){const c=activeChar(),img=imageCache.chars[c.id],p=c.image||{scale:1,x:0,y:0};return `<div class="preview-card"><div class="preview-title">当たり判定プレビュー</div><div class="hit-stage" id="hitPreview">${img?`<img src="${img}" style="transform:${avatarTransform(p)}">`:`<div class="empty-preview">キャラクター画像を設定すると<br>ここに重ねて表示されます</div>`}${c.zones.map(z=>`<div class="zone edit-zone" data-preview-zone="${z.id}" style="left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%"><b>${esc(z.label)}</b></div>`).join("")}</div><div class="preview-note">赤い枠が実際のタップ判定です。設定を動かすとすぐプレビューが更新されます。</div></div>`}
function zoneControlHtml(z){return `<div class="zone-row"><b>${esc(z.label)}</b><div class="range-line"><span>左</span><input type="range" min="0" max="100" value="${z.x}" oninput="setZone('${z.id}','x',Number(this.value));this.nextElementSibling.value=this.value"><output>${z.x}</output></div><div class="range-line"><span>上</span><input type="range" min="0" max="100" value="${z.y}" oninput="setZone('${z.id}','y',Number(this.value));this.nextElementSibling.value=this.value"><output>${z.y}</output></div><div class="range-line"><span>幅</span><input type="range" min="5" max="100" value="${z.w}" oninput="setZone('${z.id}','w',Number(this.value));this.nextElementSibling.value=this.value"><output>${z.w}</output></div><div class="range-line"><span>高さ</span><input type="range" min="5" max="100" value="${z.h}" oninput="setZone('${z.id}','h',Number(this.value));this.nextElementSibling.value=this.value"><output>${z.h}</output></div><label>この場所をつついた時の台詞</label><textarea id="hz_${z.id}" rows="3">${esc(z.lines.join("\n"))}</textarea></div>`}
function refreshHitPreview(){const old=$("hitPreview");if(!old)return;const wrap=old.closest(".preview-card");if(wrap){const temp=document.createElement("div");temp.innerHTML=hitPreviewHtml();wrap.replaceWith(temp.firstElementChild)}}
function refreshImagePreview(){const el=$("imagePreview");if(!el)return;const c=activeChar(),img=imageCache.chars[c.id];el.innerHTML=img?`<img src="${img}" style="transform:${avatarTransform(c.image)}">`:`<div class="empty-preview">まだ画像がありません<br>下の「立ち絵画像」から選択してね</div>`}
function setZone(id,key,value){const z=activeChar().zones.find(x=>x.id===id);if(!z)return;z[key]=value;saveSilent();const el=$("hitPreview");if(el){const box=el.querySelector(`[data-preview-zone="${id}"]`);if(box){box.style.left=z.x+"%";box.style.top=z.y+"%";box.style.width=z.w+"%";box.style.height=z.h+"%"}}}
function setImageSetting(key,value){const c=activeChar();c.image=c.image||{scale:1,x:0,y:0};c.image[key]=value;saveSilent();setAvatar();refreshImagePreview();const p=$("hitPreview");if(p){const img=p.querySelector("img");if(img)img.style.transform=avatarTransform(c.image)}}
function saveChar(){const c=activeChar();c.name=$("en").value.trim()||"名前なし";c.love=Math.max(0,Math.min(100,Number($("el").value)||0));for(const z of c.zones)z.lines=$("l_"+z.id).value.split("\n").map(s=>s.trim()).filter(Boolean);save();toast("キャラクター設定を保存したよ")}
function saveHitboxes(){const c=activeChar();for(const z of c.zones)z.lines=$("hz_"+z.id).value.split("\n").map(s=>s.trim()).filter(Boolean);save();toast("当たり判定を保存したよ")}
function addCharacter(){const c=makeCharacter("新しいキャラクター");data.characters.push(c);data.activeCharacterId=c.id;saveSilent();render();tab("ce");toast("キャラクターを追加したよ")}
async function removeCharacter(){if(data.characters.length<=1)return toast("最後の1人は削除できないよ");const c=activeChar();if(!confirm(`「${c.name}」を削除する？`))return;await deleteImage("char:"+c.id);data.characters=data.characters.filter(x=>x.id!==c.id);data.activeCharacterId=data.characters[0].id;delete imageCache.chars[c.id];save();toast("キャラクターを削除したよ")}
function saveGifts(){for(const g of data.gifts){g.owned=Number($("o_"+g.id).value);g.normal=$("n_"+g.id).value;g.love=$("l_"+g.id).value;g.great=$("g_"+g.id).value;g.fav=Number($("f_"+g.id).value)}save();toast("贈り物設定を保存したよ")}
function saveOutfits(){for(const o of data.outfits)o.name=$("out_"+o.id).value;save();toast("衣装設定を保存したよ")}
function addGift(){const name=$("newGiftName").value.trim();if(!name)return toast("名前を入れてね");const id="gift_"+Date.now();data.gifts.push({id,name,icon:$("newGiftIcon").value||"🎁",rarity:$("newGiftRarity").value,fav:5,normal:"ありがとう。",love:"これ、好きかも。",great:"大切にするね。",owned:0});data.images.gifts[id]="";save();toast(name+"を追加したよ")}
function addOutfit(){const name=$("newOutfitName").value.trim();if(!name)return toast("名前を入れてね");const id="outfit_"+Date.now();data.outfits.push({id,name,rarity:$("newOutfitRarity").value,owned:false});data.images.outfits[id]="";save();toast(name+"を追加したよ")}
function download(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){download("musubidokoro-data.json",new Blob([JSON.stringify(data,null,2)],{type:"application/json"}))}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.characters))throw new Error("old format");data=x;data.images=data.images||{gifts:{},outfits:{}};data.images.gifts=data.images.gifts||{};data.images.outfits=data.images.outfits||{};save();toast("読み込んだよ")}catch(e){toast("このJSONは新しい形式じゃないよ")}};r.readAsText(f)}
function resetProject(){if(!confirm("ゲームデータを初期化して、キャラクターを空の状態に戻す？"))return;localStorage.removeItem("musubidokoro-v7");location.reload()}
function installGuide(){showModal(`<h3>iPhoneでアプリ化する方法</h3><p>1. このゲームをWeb上のURLで開く<br>2. Safariの共有ボタンを押す<br>3. 「ホーム画面に追加」を選ぶ<br>4. 「むすびどころ」を追加する</p>`)}
function showModal(x){$("modalBody").innerHTML=x;$("modal").classList.add("show")}function closeModal(){$("modal").classList.remove("show")}
function crc32(b){let c=-1;for(let x of b){c^=x;for(let i=0;i<8;i++)c=(c>>>1)^(-(c&1)&0xedb88320)}return(c^-1)>>>0}
function u16(n){return[n&255,n>>>8&255]}function u32(n){return[n&255,n>>>8&255,n>>>16&255,n>>>24&255]}
function zipStore(files){const enc=new TextEncoder(),local=[],central=[];let off=0;for(const f of files){const nb=enc.encode(f.name),db=enc.encode(f.data),c=crc32(db),h=new Uint8Array([80,75,3,4,20,0,0,0,0,0,0,0,...u16(0),...u16(0),...u32(c),...u32(db.length),...u32(db.length),...u16(nb.length),0,0,...nb]);local.push(h,db);central.push(new Uint8Array([80,75,1,2,20,0,20,0,0,0,0,0,0,0,...u16(0),...u16(0),...u32(c),...u32(db.length),...u32(db.length),...u16(nb.length),0,0,0,0,0,0,0,0,...u32(off),...nb]));off+=h.length+db.length}const cd=central.reduce((n,x)=>n+x.length,0),end=new Uint8Array([80,75,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cd),...u32(off),0,0]);return new Blob([...local,...central,end],{type:"application/zip"})}
function exportZip(){const files=[{name:"index.html",data:document.documentElement.outerHTML},{name:"manifest.webmanifest",data:JSON.stringify(manifest,null,2)},{name:"musubidokoro-data.json",data:JSON.stringify(data,null,2)},{name:"README.txt",data:"むすびどころ PWA\nSafariでWeb上に配置して開き、共有→ホーム画面に追加でアプリ風に起動できます。\n"}];download("musubidokoro-pwa.zip",zipStore(files))}
const manifest={name:"むすびどころ",short_name:"むすびどころ",start_url:"./",display:"standalone",background_color:"#f8f0de",theme_color:"#8f3438",lang:"ja"};
(async()=>{await loadImages();render();if("serviceWorker" in navigator){navigator.serviceWorker.register("./service-worker.js").catch(()=>{})}})();
</script>
</body></html>
