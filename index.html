<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="むすびどころ">
<link rel="manifest" href="manifest.webmanifest">
<title>むすびどころ</title>
<style>
:root{--red:#8f3438;--deep:#43282a;--gold:#b48a43;--paper:#f8f0de;--cream:#fffaf0;--line:#c8ab79;--muted:#77695e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#201a18;color:#332927;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}button,input,textarea,select{font:inherit}button{border:0}
#app{width:100%;max-width:520px;min-height:100dvh;margin:auto;background:var(--paper);overflow:hidden;position:relative}
header{height:58px;display:grid;grid-template-columns:auto minmax(88px,1fr) auto;align-items:center;gap:7px;padding:0 10px;background:#fffaf0f2;border-bottom:1px solid var(--line);position:relative;z-index:10}.logo{font-weight:bold;letter-spacing:.08em;font-size:17px;white-space:nowrap}.wallet{font-size:10px;white-space:nowrap;text-align:right}.screen{display:none;min-height:calc(100dvh - 54px);padding-bottom:82px}.screen.active{display:block}
.home{position:relative;background:#f8f0de url("./festival-bg.png") center top/cover no-repeat;overflow:hidden}
.home:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#fffaf044 0%,#fffaf000 32%,#43282a14 100%);pointer-events:none}
.hero{height:calc(100dvh - 136px);min-height:520px;position:relative;display:flex;justify-content:center;align-items:center}
.char{width:min(82vw,360px);height:min(84vh,600px);overflow:hidden;min-height:440px;border-radius:46% 46% 12% 12%;background:transparent;box-shadow:none;position:relative;transition:.15s;user-select:none}
.char.blink{filter:brightness(1.05)}.char img.avatar{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:contain;z-index:1;pointer-events:none;transform:translate(-50%,-50%) scale(1);transform-origin:center center}.zone.edit-zone{border:1px dashed #8f3438;background:#8f34381c;z-index:4}.zone.edit-zone b{font-size:10px;background:#8f3438;color:#fff;padding:2px 5px;border-radius:5px;position:absolute;left:3px;top:3px}.hit-preview{position:relative;width:220px;height:330px;margin:10px auto;border-radius:46% 46% 12% 12%;background:transparent;overflow:hidden;box-shadow:none}.hit-preview img{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:contain;transform:translate(-50%,-50%);pointer-events:none}.zone-row{border:1px solid #ddceb2;border-radius:9px;padding:9px;margin:8px 0;background:#fffaf0}.range-line{display:grid;grid-template-columns:42px 1fr 54px;gap:6px;align-items:center;font-size:11px;margin:5px 0}.range-line input[type=range]{padding:0;border:0}.range-line output{text-align:right}.char-switch{width:100%;min-width:0;max-width:125px;background:#fffdf8;border:1px solid var(--line);border-radius:7px;padding:5px;font-size:11px;white-space:nowrap;overflow:hidden}.editor-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.preview-card{background:#f3e5c9;border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}.preview-title{font-weight:bold;color:var(--red);font-size:12px;margin-bottom:6px}.preview-note{font-size:10px;color:var(--muted);margin-top:6px}.image-stage,.hit-stage{position:relative;width:min(82vw,290px);height:min(112vw,390px);margin:10px auto;border-radius:46% 46% 12% 12%;background:transparent;overflow:hidden;box-shadow:none}.image-stage img,.hit-stage img{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:contain;pointer-events:none;transform-origin:center center}.empty-preview{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#806f61;font-size:12px;text-align:center;padding:20px}.hit-stage .zone.edit-zone{cursor:pointer}.zone.edit-zone.active{outline:2px solid #43282a;background:#8f34384a}.zone.edit-zone b{white-space:nowrap}.char .zone{z-index:3}
.zone{position:absolute;z-index:3;border:1px dashed transparent;border-radius:30px;background:transparent}
.zone:active{background:#8f343822}.head{top:6%;left:10%;width:80%;height:26%}.face{top:18%;left:25%;width:50%;height:20%}.hand{top:42%;left:5%;width:35%;height:28%}.body{top:40%;left:27%;width:55%;height:40%}
.dialogue{position:absolute;left:13px;right:13px;bottom:12px;background:#fffaf0ed;border:1px solid var(--line);border-radius:12px;padding:12px 15px;box-shadow:0 7px 20px #4b30221e;z-index:5}
.name{color:var(--red);font-size:12px;font-weight:bold}.line{font-size:16px;line-height:1.6;margin-top:3px}.meter{height:7px;background:#e0d2b7;border-radius:99px;margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--red);width:12%}.love{font-size:10px;color:var(--muted);margin-top:3px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:68px;padding-bottom:env(safe-area-inset-bottom);background:#fffaf0f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
.nav button{background:none;color:#55443d;font-size:10px;padding:6px 2px}.nav b{display:block;font-size:20px;color:var(--red);line-height:22px}
.panel{padding:17px 14px}.panel h2{margin:2px 0 13px;font-size:20px}.card{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.item{text-align:left;background:var(--cream);border:1px solid var(--line);border-radius:11px;padding:9px}.icon{height:85px;background:#efe1c7;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:7px}.row{display:flex;justify-content:space-between;gap:6px;align-items:center}.tag{font-size:10px;color:#785a24;border:1px solid var(--gold);border-radius:99px;padding:2px 5px}.small{font-size:11px;color:var(--muted)}.btn{background:var(--red);color:white;border:1px solid #72272b;border-radius:8px;padding:9px 12px}.btn.alt{background:var(--cream);color:var(--red);border-color:var(--line)}
.gacha-banner{height:215px;border-radius:15px;background:linear-gradient(145deg,#652a37,#b8874d 57%,#f0ddb1);color:#fff9ec;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 12px 30px #43212640;margin-bottom:13px}.gacha-banner h3{font-size:27px;margin:5px}.result{line-height:1.8}
.char-preview{height:300px;display:flex;align-items:center;justify-content:center}.char.smallchar{width:160px;height:270px}
label{display:block;font-size:12px;margin:9px 0 5px}input,textarea,select{width:100%;background:#fffdf8;border:1px solid var(--line);border-radius:7px;padding:8px;color:#332927}textarea{resize:vertical}.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:5px}.tabs button{white-space:nowrap}.editor{margin-top:10px}.hint{font-size:11px;color:var(--muted);line-height:1.55}.sep{border:0;border-top:1px solid #ddceb2;margin:14px 0}
.bg-preview{position:relative;width:100%;height:260px;border-radius:10px;background-position:center;background-size:cover;background-repeat:no-repeat;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8f3438;text-align:center;font-weight:bold;letter-spacing:.08em}.bg-remove-card{background:#fffaf0;border:1px solid #ddceb2;border-radius:10px;padding:10px;margin:10px 0}.bg-remove-card .row{align-items:center}.range-readout{font-size:11px;color:#806f61;min-width:42px;text-align:right}.bg-preview:after{content:"";position:absolute;inset:0;background:#fffaf01c;pointer-events:none}.bg-preview>div{position:relative;z-index:1;background:#fffaf0d9;border:1px solid #ddceb2;border-radius:10px;padding:10px 14px}.bg-preview small{font-size:9px;font-weight:normal;letter-spacing:0}.modal{display:none;position:fixed;inset:0;background:#1d1614aa;z-index:40;align-items:flex-end}.modal.show{display:flex}.modalbox{width:min(520px,100%);max-height:88dvh;overflow:auto;background:var(--paper);border-radius:18px 18px 0 0;padding:16px}.toast{display:none;position:fixed;z-index:50;left:50%;bottom:86px;transform:translateX(-50%);background:#2d2421;color:white;padding:9px 14px;border-radius:99px;font-size:12px}
</style>
</head>
<body>
<div id="app">
<header><div class="logo">むすびどころ</div><select id="charSwitcher" class="char-switch" aria-label="キャラクター切替"></select><div class="wallet">花玉 <b id="gems">1200</b>　贈り物 <b id="count">0</b></div></header>

<section id="home" class="screen active home">
 <div class="hero">
  <div id="char" class="char"></div>
  <div class="dialogue"><div class="name" id="name">新しいキャラクター</div><div class="line" id="line">……。</div><div class="meter"><i id="meter"></i></div><div class="love" id="love">親密度 0 / 100</div></div>
 </div>
</section>

<section id="gift" class="screen"><div class="panel"><h2>贈り物</h2><div class="card hint">アイテムをタップするとキャラクターに贈れます。反応と親密度は編集画面から変更できます。</div><div id="giftGrid" class="grid"></div></div></section>
<section id="gacha" class="screen"><div class="panel"><h2>召喚</h2><div class="gacha-banner"><div>期間限定</div><h3 id="gachaName">夏祭り・百花繚乱</h3><div>SSR 5%　SR 20%　R 75%</div></div><div class="row"><button class="btn" onclick="pull(1)">1回　100花玉</button><button class="btn" onclick="pull(10)">10回　900花玉</button></div><div id="result" class="card result" style="margin-top:12px">召喚結果がここに表示されます。</div></div></section>
<section id="dress" class="screen"><div class="panel"><h2>着せ替え</h2><div class="card"><div class="char-preview"><div class="char smallchar"></div></div><div id="outfitNow">通常衣装</div></div><div id="outfitGrid" class="grid"></div></div></section>
<section id="edit" class="screen"><div class="panel"><h2>制作・設定</h2><div class="card"><div class="tabs"><button class="btn alt" onclick="tab('ce')">キャラクター</button><button class="btn alt" onclick="tab('hit')">当たり判定</button><button class="btn alt" onclick="tab('ge')">贈り物</button><button class="btn alt" onclick="tab('oe')">衣装</button><button class="btn alt" onclick="tab('qa')">ガチャ</button><button class="btn alt" onclick="tab('bg')">背景</button><button class="btn alt" onclick="tab('io')">保存</button></div><div id="ce" class="editor"></div><div id="hit" class="editor" style="display:none"></div><div id="ge" class="editor" style="display:none"></div><div id="oe" class="editor" style="display:none"></div><div id="qa" class="editor" style="display:none"></div><div id="bg" class="editor" style="display:none"></div><div id="io" class="editor" style="display:none"></div></div></div></section>

<nav class="nav"><button onclick="go('home')"><b>花</b>ホーム</button><button onclick="go('gift')"><b>贈</b>贈り物</button><button onclick="go('gacha')"><b>召</b>ガチャ</button><button onclick="go('dress')"><b>衣</b>着せ替え</button><button onclick="go('edit')"><b>筆</b>編集</button></nav>
</div>
<div id="modal" class="modal"><div class="modalbox"><div id="modalBody"></div><button class="btn alt" onclick="closeModal()" style="margin-top:10px">閉じる</button></div></div>
<div id="toast" class="toast"></div>

<script>const seed={
characters:[],activeCharacterId:null,
gifts:[
{id:"onigiri",name:"おにぎり",icon:"🍙",rarity:"R",fav:8,normal:"お、これ好きなんだよね。",love:"具は何かな？",great:"君が握ってくれたの？",owned:3},
{id:"apple",name:"りんご飴",icon:"🍎",rarity:"SR",fav:12,normal:"お祭りのやつだね。",love:"……これ、好き。",great:"これを選んでくれたの？",owned:2},
{id:"matcha",name:"抹茶",icon:"🍵",rarity:"N",fav:3,normal:"渋いの選ぶね。",love:"落ち着く味だね。",great:"こういうの、覚えててくれたんだ。",owned:5},
{id:"dango",name:"月見団子",icon:"🍡",rarity:"R",fav:7,normal:"ひとつ食べる？",love:"月がきれいな夜に食べたいね。",great:"一緒に食べよう。",owned:1},
{id:"ramune",name:"ラムネ",icon:"🫧",rarity:"SR",fav:10,normal:"懐かしいな。",love:"祭りって感じがする。",great:"……一緒に飲む？",owned:0},
{id:"firework",name:"花火",icon:"🎆",rarity:"SSR",fav:20,normal:"きれいだね。",love:"夜空に咲く花みたい。",great:"……君と見たかった。",owned:0}],
outfits:[{id:"default",name:"通常衣装",rarity:"N",owned:true},{id:"summer",name:"夏祭りの浴衣",rarity:"SR",owned:false},{id:"formal",name:"月夜の晴れ着",rarity:"SSR",owned:false}],
gacha:{name:"夏祭り・百花繚乱"},images:{gifts:{},outfits:{}}};

const zoneDefaults=[
{id:"head",label:"頭",x:10,y:6,w:80,h:26,lines:["髪、触るの好きなの？","……くすぐったいよ。","また頭を撫でてる。"],spamCount:5,spamLines:["……ちょっと、つつきすぎじゃない？"]},
{id:"face",label:"顔",x:25,y:18,w:50,h:20,lines:["そんなに顔を見る？","……近いよ。","楽しそうだね。"],spamCount:5,spamLines:["そんなに顔ばかりつつかないでよ。"]},
{id:"hand",label:"手",x:5,y:42,w:35,h:28,lines:["手、繋ぎたいの？","……しょうがないな。","どうしたの？"],spamCount:5,spamLines:["……手ばかりつつくの、好きなの？"]},
{id:"body",label:"身体",x:27,y:40,w:55,h:40,lines:["そこはつつくところじゃないよ。","ふふ、元気だね。","今日はご機嫌だね。"],spamCount:5,spamLines:["……もう、つつきすぎだよ。"]}
];
function makeCharacter(name="新しいキャラクター"){
 const id="char_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
 return {id,name,love:0,image:{scale:1,x:0,y:0},zones:JSON.parse(JSON.stringify(zoneDefaults))};
}
function migrate(){
 const fresh=JSON.parse(JSON.stringify(seed));
 let current=JSON.parse(localStorage.getItem("musubidokoro-v7")||"null");
 if(current&&Array.isArray(current.characters))return current;
 current=JSON.parse(localStorage.getItem("musubidokoro-v6")||"null");
 if(current&&Array.isArray(current.characters)){
   current.characters=current.characters.filter(c=>c.name!=="綾乃");
   if(!current.characters.length){const c=makeCharacter();current.characters=[c];current.activeCharacterId=c.id}
   if(!current.characters.some(c=>c.id===current.activeCharacterId))current.activeCharacterId=current.characters[0].id;
   current.images=current.images||{gifts:{},outfits:{}}; current.images.gifts=current.images.gifts||{}; current.images.outfits=current.images.outfits||{};
   localStorage.setItem("musubidokoro-v7",JSON.stringify(current));
   return current;
 }
 let source=JSON.parse(localStorage.getItem("musubidokoro-v5")||"null");
 if(!source) source=JSON.parse(localStorage.getItem("hanagasumi-v2")||"null");
 if(source){
   fresh.gifts=source.gifts||fresh.gifts; fresh.outfits=source.outfits||fresh.outfits; fresh.gacha=source.gacha||fresh.gacha;
   fresh.images.gifts=source.images?.gifts||{}; fresh.images.outfits=source.images?.outfits||{};
   fresh.characters=Array.isArray(source.characters)?source.characters:[];
   // 旧版で残っていた「綾乃」だけを一度だけ整理する。ユーザーが作った他のキャラクターは残す。
   const removed=fresh.characters.filter(c=>c.name==="綾乃");
   fresh.characters=fresh.characters.filter(c=>c.name!=="綾乃");
   removed.forEach(c=>{try{localStorage.removeItem("musubidokoro-image-char:"+c.id)}catch(e){}});
 }
 if(!fresh.characters.length){const c=makeCharacter();fresh.characters=[c];fresh.activeCharacterId=c.id}
 if(!fresh.characters.some(c=>c.id===fresh.activeCharacterId))fresh.activeCharacterId=fresh.characters[0].id;
 fresh.images=fresh.images||{};fresh.images.gifts=fresh.images.gifts||{};fresh.images.outfits=fresh.images.outfits||{};fresh.images.characters=fresh.images.characters||{};
 localStorage.setItem("musubidokoro-v7",JSON.stringify(fresh));
 return fresh;
}
let data=migrate();
let gems=Number(localStorage.getItem("hanagasumi-gems")||1200);
let currentTab="ce";
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalizeZones(c){if(!c||!Array.isArray(c.zones))return;c.zones.forEach(z=>{z.spamCount=Math.max(1,Number(z.spamCount)||5);if(!Array.isArray(z.spamLines))z.spamLines=["……ちょっと、つつきすぎじゃない？"];if(!Array.isArray(z.lines))z.lines=[]})}
function activeChar(){const c=data.characters.find(c=>c.id===data.activeCharacterId)||data.characters[0];normalizeZones(c);return c}
function save(){localStorage.setItem("musubidokoro-v7",JSON.stringify(data));localStorage.setItem("hanagasumi-gems",gems);render()}
function saveSilent(){localStorage.setItem("musubidokoro-v7",JSON.stringify(data));localStorage.setItem("hanagasumi-gems",gems)}
function go(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").style.display="none",1500)}
function rand(a){return a&&a.length?a[Math.floor(Math.random()*a.length)]:"……"}

const IMAGE_DB="musubidokoro-images-v5";
let imageCache={chars:{},gifts:{},outfits:{},background:""};
const imageObjectUrls=[];
function openImageDB(){return new Promise((resolve,reject)=>{try{const r=indexedDB.open(IMAGE_DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("images"))db.createObjectStore("images")};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
function makeImageUrl(v){if(!v)return "";if(typeof v==="string")return v;if(v instanceof Blob){const u=URL.createObjectURL(v);imageObjectUrls.push(u);return u}return ""}
async function putImage(key,value){
 // 画像はdata URL文字列としてIndexedDBに保存。File/Blobの構造化保存には依存しない。
 try{const db=await openImageDB();await new Promise((resolve,reject)=>{const tx=db.transaction("images","readwrite");tx.objectStore("images").put(value,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();return true}catch(e){console.warn("IndexedDB save failed",e);return false}
}
async function getImage(key){
 try{const db=await openImageDB();const v=await new Promise((resolve,reject)=>{const tx=db.transaction("images","readonly");const r=tx.objectStore("images").get(key);r.onsuccess=()=>resolve(r.result||"");r.onerror=()=>reject(r.error)});db.close();if(v)return makeImageUrl(v)}catch(e){}
 // v7以前のdata URLも読み込めるようにする
 try{return localStorage.getItem("musubidokoro-image-"+key)||""}catch(e){return ""}
}
async function deleteImage(key){try{const db=await openImageDB();await new Promise((resolve,reject)=>{const tx=db.transaction("images","readwrite");tx.objectStore("images").delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){}try{localStorage.removeItem("musubidokoro-image-"+key)}catch(e){}}
async function loadImages(){
 for(const c of data.characters)imageCache.chars[c.id]=await getImage("char:"+c.id);
 for(const g of data.gifts)imageCache.gifts[g.id]=await getImage("gift:"+g.id);
 for(const o of data.outfits)imageCache.outfits[o.id]=await getImage("outfit:"+o.id);
 imageCache.background=await getImage("background");
 setHomeBackground();
}
function avatarTransform(p){return `translate(calc(-50% + ${Number(p?.x)||0}%),calc(-50% + ${Number(p?.y)||0}%)) scale(${Number(p?.scale)||1})`}
function setHomeBackground(){const home=$("home");if(!home)return;if(imageCache.background)home.style.backgroundImage=`url("${imageCache.background}")`;else home.style.backgroundImage='url("./festival-bg.png")'}
function pointToZone(charEl,clientX,clientY){
 const r=charEl.getBoundingClientRect();
 const x=(clientX-r.left)/r.width*100;
 const y=(clientY-r.top)/r.height*100;
 const c=activeChar();
 const hits=(c?.zones||[]).filter(z=>x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h);
 hits.sort((a,b)=>(a.w*a.h)-(b.w*b.h));
 return hits[0]||null;
}
function setAvatar(){
 const c=activeChar(),box=$("char");box.innerHTML="";if(!c)return;
 const img=imageCache.chars[c.id];
 if(img){const im=document.createElement("img");im.className="avatar";im.src=img;im.style.transform=avatarTransform(c.image);box.appendChild(im)}
 // ホームの当たり判定は透明ボタンを重ねず、座標から厳密に判定する。
 box.onpointerdown=onCharacterPointer;
}
function onCharacterPointer(e){
 if(e.pointerType==="mouse"&&e.button!==0)return;
 const z=pointToZone(e.currentTarget,e.clientX,e.clientY);
 if(z)tapZone(z.id);
}
function tapZone(id){
 const c=activeChar(),z=c?.zones.find(x=>x.id===id);if(!z)return;
 normalizeZones(c);
 if(!c._tapState)c._tapState={zoneId:null,count:0,lineIndex:0};
 if(c._tapState.zoneId===id){c._tapState.count++;}else{c._tapState.zoneId=id;c._tapState.count=1;c._tapState.lineIndex=0}
 const threshold=Math.max(1,Number(z.spamCount)||5);
 let line;
 if(c._tapState.count>=threshold){
   line=rand(z.spamLines?.length?z.spamLines:["……つつきすぎだよ。"]);
   c._tapState.count=0;
   c._tapState.lineIndex=0;
   saveSilent();
 }else{
   const lines=z.lines?.length?z.lines:["……"];
   line=lines[c._tapState.lineIndex%lines.length];
   c._tapState.lineIndex=(c._tapState.lineIndex+1)%lines.length;
 }
 // pointerdownから直接変更するので、連続タップでも待ち時間なし。
 $("line").textContent=line;

function readFileAsDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||""));r.onerror=()=>reject(r.error||new Error("FileReader failed"));r.readAsDataURL(file)})}
async function fileToImage(input,key,cacheType){
 const f=input.files?.[0];
 if(!f)return;
 try{
   // 画像をcanvasにもBlobにも変換しない。FileReaderで「選んだファイル→data URL」を直接作る。
   // iPhone SafariでのBlob/IndexedDB/URL.createObjectURLの相性問題を避ける。
   const url=await readFileAsDataURL(f);
   if(!url)throw new Error("data URLを作れませんでした");
   // Safariが実際に画像として描画できるか、その場で確認する。
   await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve();im.onerror=()=>reject(new Error("画像を表示できませんでした"));im.src=url});
   const id=key.split(":")[1];
   if(!imageCache[cacheType])imageCache[cacheType]={};
   imageCache[cacheType][id]=url;
   // IndexedDBには文字列として保存するので、File/Blobの構造化保存に依存しない。
   const saved=await putImage(key,url);
   if(!saved)console.warn("画像は表示できるけどIndexedDBへの保存に失敗しました",key);
   // エディタ全体をrenderし直さず、現在のプレビューだけを更新する。
   setAvatar();
   refreshImagePreview();
   refreshHitPreview();
   toast(saved?"画像を読み込んだよ":"画像を表示したよ（保存はできなかったけど表示はできています）");
 }catch(e){
   console.error("image load failed",e,f?.name,f?.type,e?.message,e);
   toast("この画像はSafariで表示できなかったよ。別のPNG/JPEGでも試してみて");
 }
}

async function fileToBackground(input){

   if(!url)throw new Error("data URLを作れませんでした");
   await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve();im.onerror=()=>reject(new Error("画像を表示できませんでした"));im.src=url});

async function removeCharacterBackground(){
 const c=activeChar(),src=imageCache.chars[c.id];
 if(!src)return toast("先に立ち絵画像を選んでね");
 if(!confirm("立ち絵の端からつながっている背景を透明にするよ。よければ続けてね。"))return;
 const tolerance=Math.max(15,Math.min(70,Number($("bgRemoveTol")?.value)||36));
 try{
  const im=await new Promise((resolve,reject)=>{const x=new Image();x.onload=()=>resolve(x);x.onerror=()=>reject(new Error("image load failed"));x.src=src});
  const maxSide=1600,ratio=Math.min(1,maxSide/Math.max(im.naturalWidth,im.naturalHeight));
  const w=Math.max(1,Math.round(im.naturalWidth*ratio)),h=Math.max(1,Math.round(im.naturalHeight*ratio));
  const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(im,0,0,w,h);
  const img=ctx.getImageData(0,0,w,h),d=img.data,seen=new Uint8Array(w*h),q=new Int32Array(w*h),tol=tolerance,tol2=tol*tol;
  let head=0,tail=0;
  const push=(x,y)=>{const i=y*w+x;if(!seen[i]){seen[i]=1;q[tail++]=i}};
  for(let x=0;x<w;x++){push(x,0);if(h>1)push(x,h-1)}
  for(let y=1;y<h-1;y++){push(0,y);if(w>1)push(w-1,y)}
  const neighbors=[[-1,0],[1,0],[0,-1],[0,1]];
  while(head<tail){
   const idx=q[head++],x=idx%w,y=(idx/w)|0,pi=idx*4;
   if(d[pi+3]===0)continue;
   const r=d[pi],g=d[pi+1],b=d[pi+2];
   d[pi+3]=0;
   for(const [dx,dy] of neighbors){
    const nx=x+dx,ny=y+dy;if(nx<0||nx>=w||ny<0||ny>=h)continue;const ni=ny*w+nx,npi=ni*4;
    if(seen[ni]||d[npi+3]===0)continue;
    const dr=d[npi]-r,dg=d[npi+1]-g,db=d[npi+2]-b;
    if(dr*dr+dg*dg+db*db<=tol2)push(nx,ny);
   }
  }
  const out=canvas.toDataURL("image/png");
  const saved=await putImage("char:"+c.id,out);
  imageCache.chars[c.id]=out;setAvatar();refreshImagePreview();refreshHitPreview();
  toast(saved?"背景を透過して保存したよ":"背景を透過したよ（表示のみ）");
 }catch(e){console.error("background removal failed",e);toast("背景の透過に失敗したよ。もう一度試してみて")}
}

function setImageSetting(key,value){const c=activeChar();c.image=c.image||{scale:1,x:0,y:0};c.image[key]=value;saveSilent();setAvatar();refreshImagePreview();const p=$("hitPreview");if(p){const img=p.querySelector("img");if(img)img.style.transform=avatarTransform(c.image)}}
function saveChar(){const c=activeChar();c.name=$("en").value.trim()||"名前なし";c.love=Math.max(0,Math.min(100,Number($("el").value)||0));for(const z of c.zones){z.lines=$("l_"+z.id).value.split("\n").map(s=>s.trim()).filter(Boolean);normalizeZones(c)}save();toast("キャラクター設定を保存したよ")}
function setSpamCount(id,value){const z=activeChar().zones.find(x=>x.id===id);if(!z)return;z.spamCount=Math.max(1,Math.min(99,Number(value)||1));saveSilent()}
function saveHitboxes(){const c=activeChar();for(const z of c.zones){z.lines=$("hz_"+z.id).value.split("\n").map(s=>s.trim()).filter(Boolean);z.spamLines=$("hs_"+z.id).value.split("\n").map(s=>s.trim()).filter(Boolean);z.spamCount=Math.max(1,Math.min(99,Number(z.spamCount)||1))}save();toast("当たり判定を保存したよ")}
function addCharacter(){const c=makeCharacter("新しいキャラクター");data.characters.push(c);data.activeCharacterId=c.id;saveSilent();render();tab("ce");toast("キャラクターを追加したよ")}
async function removeCharacter(){if(data.characters.length<=1)return toast("最後の1人は削除できないよ");const c=activeChar();if(!confirm(`「${c.name}」を削除する？`))return;await deleteImage("char:"+c.id);data.characters=data.characters.filter(x=>x.id!==c.id);data.activeCharacterId=data.characters[0].id;delete imageCache.chars[c.id];save();toast("キャラクターを削除したよ")}
function saveGifts(){for(const g of data.gifts){g.owned=Number($("o_"+g.id).value);g.normal=$("n_"+g.id).value;g.love=$("l_"+g.id).value;g.great=$("g_"+g.id).value;g.fav=Number($("f_"+g.id).value)}save();toast("贈り物設定を保存したよ")}
function saveOutfits(){for(const o of data.outfits)o.name=$("out_"+o.id).value;save();toast("衣装設定を保存したよ")}
function addGift(){const name=$("newGiftName").value.trim();if(!name)return toast("名前を入れてね");const id="gift_"+Date.now();data.gifts.push({id,name,icon:$("newGiftIcon").value||"🎁",rarity:$("newGiftRarity").value,fav:5,normal:"ありがとう。",love:"これ、好きかも。",great:"大切にするね。",owned:0});data.images.gifts[id]="";save();toast(name+"を追加したよ")}
function addOutfit(){const name=$("newOutfitName").value.trim();if(!name)return toast("名前を入れてね");const id="outfit_"+Date.now();data.outfits.push({id,name,rarity:$("newOutfitRarity").value,owned:false});data.images.outfits[id]="";save();toast(name+"を追加したよ")}
function download(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){download("musubidokoro-data.json",new Blob([JSON.stringify(data,null,2)],{type:"application/json"}))}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.characters))throw new Error("old format");data=x;data.images=data.images||{gifts:{},outfits:{}};data.images.gifts=data.images.gifts||{};data.images.outfits=data.images.outfits||{};save();toast("読み込んだよ")}catch(e){toast("このJSONは新しい形式じゃないよ")}};r.readAsText(f)}
function resetProject(){if(!confirm("ゲームデータを初期化して、キャラクターを空の状態に戻す？"))return;localStorage.removeItem("musubidokoro-v7");location.reload()}
function installGuide(){showModal(`<h3>iPhoneでアプリ化する方法</h3><p>1. このゲームをWeb上のURLで開く<br>2. Safariの共有ボタンを押す<br>3. 「ホーム画面に追加」を選ぶ<br>4. 「むすびどころ」を追加する</p>`)}
function showModal(x){$("modalBody").innerHTML=x;$("modal").classList.add("show")}function closeModal(){$("modal").classList.remove("show")}
function crc32(b){let c=-1;for(let x of b){c^=x;for(let i=0;i<8;i++)c=(c>>>1)^(-(c&1)&0xedb88320)}return(c^-1)>>>0}
function u16(n){return[n&255,n>>>8&255]}function u32(n){return[n&255,n>>>8&255,n>>>16&255,n>>>24&255]}
function zipStore(files){const enc=new TextEncoder(),local=[],central=[];let off=0;for(const f of files){const nb=enc.encode(f.name),db=enc.encode(f.data),c=crc32(db),h=new Uint8Array([80,75,3,4,20,0,0,0,0,0,0,0,...u16(0),...u16(0),...u32(c),...u32(db.length),...u32(db.length),...u16(nb.length),0,0,...nb]);local.push(h,db);central.push(new Uint8Array([80,75,1,2,20,0,20,0,0,0,0,0,0,0,...u16(0),...u16(0),...u32(c),...u32(db.length),...u32(db.length),...u16(nb.length),0,0,0,0,0,0,0,0,...u32(off),...nb]));off+=h.length+db.length}const cd=central.reduce((n,x)=>n+x.length,0),end=new Uint8Array([80,75,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cd),...u32(off),0,0]);return new Blob([...local,...central,end],{type:"application/zip"})}
function exportZip(){const files=[{name:"index.html",data:document.documentElement.outerHTML},{name:"manifest.webmanifest",data:JSON.stringify(manifest,null,2)},{name:"musubidokoro-data.json",data:JSON.stringify(data,null,2)},{name:"README.txt",data:"むすびどころ PWA\nSafariでWeb上に配置して開き、共有→ホーム画面に追加でアプリ風に起動できます。\n"}];download("musubidokoro-pwa.zip",zipStore(files))}
const manifest={name:"むすびどころ",short_name:"むすびどころ",start_url:"./",display:"standalone",background_color:"#f8f0de",theme_color:"#8f3438",lang:"ja"};
(async()=>{await loadImages();render();if("serviceWorker" in navigator){navigator.serviceWorker.register("./service-worker.js").catch(()=>{})}})();
</script>
